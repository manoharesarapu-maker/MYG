id: parking.dispute-appeal
domain: parking-permits
parent_interaction: "Dispute or appeal a parking permit decision"
tier: 2
status: built
requirements:
  - id: applicant_name
    label: "Full name"
    type: text
    required: true
  - id: related_permit_or_application
    label: "The permit number or application this dispute relates to, if known"
    type: text
    required: false
  - id: dispute_reason
    label: "Briefly, what decision are you disputing and why?"
    type: text
    required: true
decision_logic:
  - "Disputes and appeals are never resolved automatically."
  - "All disputes -> outcome: staff_review_required"
outcomes:
  staff_review_required:
    message_template: "Thanks — we've recorded the details of your dispute. A staff member will review the original decision and your reasons for appeal, and will get back to you directly."
escalation: "staff_review_dispute"
